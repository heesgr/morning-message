<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Morning Message" />
  <title>Morning Message</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fdf6ee;
      color: #3b2a1a;
      min-height: 100vh;
      padding: 20px 16px 40px;
    }

    header {
      text-align: center;
      padding: 16px 0 24px;
    }

    header .cross { font-size: 32px; margin-bottom: 6px; }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #5c3d1e;
      line-height: 1.2;
    }

    header p {
      font-size: 15px;
      color: #8a6a4a;
      margin-top: 4px;
    }

    section {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: #5c3d1e;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      font-size: 18px;
      padding: 14px 16px;
      border: 2px solid #ddc9b0;
      border-radius: 12px;
      background: #fdf6ee;
      color: #3b2a1a;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #a0683a;
    }

    .theme-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .theme-row input {
      flex: 1;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { opacity: 0.8; transform: scale(0.97); }

    .btn-random {
      background: #e8d5bb;
      color: #5c3d1e;
      font-size: 15px;
      padding: 14px 16px;
      white-space: nowrap;
    }

    .btn-generate {
      width: 100%;
      background: #7a4520;
      color: #fff;
      font-size: 20px;
      padding: 18px;
      border-radius: 14px;
      letter-spacing: 0.3px;
    }

    .btn-generate:disabled {
      background: #c4a882;
      cursor: not-allowed;
      transform: none;
    }

    .btn-copy {
      width: 100%;
      background: #e8f5e9;
      color: #2e6b34;
      font-size: 18px;
      padding: 16px;
      border: 2px solid #a5d6a7;
      margin-top: 12px;
    }

    .btn-copy.copied {
      background: #c8e6c9;
    }

    #output {
      font-size: 17px;
      line-height: 1.7;
      color: #2c1e0f;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #output.placeholder {
      color: #b09070;
      font-style: italic;
    }

    .spinner {
      display: none;
      text-align: center;
      padding: 20px 0;
      font-size: 15px;
      color: #8a6a4a;
    }

    .spinner.visible { display: block; }

    .spinner::before {
      content: '';
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #ddc9b0;
      border-top-color: #7a4520;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .api-toggle {
      text-align: center;
      margin-bottom: 6px;
    }

    .api-toggle button {
      background: none;
      color: #a0683a;
      font-size: 13px;
      padding: 4px 8px;
      text-decoration: underline;
      font-weight: 400;
    }

    #api-section { display: none; }
    #api-section.visible { display: block; }

    .hint {
      font-size: 13px;
      color: #8a6a4a;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="cross">✝️</div>
  <h1>Morning Message</h1>
  <p>A daily blessing for the family</p>
</header>

<!-- Theme -->
<section>
  <label for="theme">Today's Theme</label>
  <div class="theme-row">
    <input type="text" id="theme" placeholder="e.g. strength, hope, peace…" autocomplete="off" autocorrect="off" />
    <button class="btn-random" onclick="pickRandom()">🎲 Random</button>
  </div>
</section>

<!-- Generate -->
<button class="btn-generate" id="generate-btn" onclick="generate()">
  ✨ Generate Message
</button>

<!-- Output -->
<section style="margin-top:16px;">
  <div id="spinner" class="spinner">Creating your message…</div>
  <div id="output" class="placeholder">Your morning message will appear here.</div>
  <button class="btn-copy" id="copy-btn" onclick="copyMessage()" style="display:none;">
    📋 Copy Message
  </button>
</section>

<!-- API Key (collapsed by default) -->
<div class="api-toggle">
  <button onclick="toggleApi()">⚙️ API Key Settings</button>
</div>
<section id="api-section">
  <label for="apikey">Claude API Key</label>
  <input type="password" id="apikey" placeholder="sk-ant-…" autocomplete="off" autocorrect="off" autocapitalize="off" />
  <p class="hint">Saved on this device only. Get one at console.anthropic.com</p>
  <button onclick="saveKey()" style="margin-top:10px; background:#7a4520; color:#fff; font-size:15px; padding:12px 20px;">Save Key</button>
</section>

<script>
  const THEMES = [
    "faith","hope","love","peace","joy","strength","perseverance","grace",
    "gratitude","forgiveness","courage","trust","patience","mercy","renewal",
    "comfort","wisdom","humility","abundance","praise","protection","healing",
    "steadfastness","light","salvation"
  ];

  function pickRandom() {
    const t = THEMES[Math.floor(Math.random() * THEMES.length)];
    document.getElementById('theme').value = t;
  }

  function toggleApi() {
    const s = document.getElementById('api-section');
    s.classList.toggle('visible');
    if (s.classList.contains('visible')) {
      const saved = localStorage.getItem('claude_api_key') || '';
      document.getElementById('apikey').value = saved;
    }
  }

  function saveKey() {
    const key = document.getElementById('apikey').value.trim();
    if (key) {
      localStorage.setItem('claude_api_key', key);
      alert('API key saved! ✓');
      document.getElementById('api-section').classList.remove('visible');
    }
  }

  const HISTORY_LIMIT = 10;
  const HISTORY_KEY = 'morning_message_history';

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || {}; }
    catch { return {}; }
  }

  function saveHistory(history) {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  function getThemeHistory(theme) {
    const history = loadHistory();
    const key = theme.toLowerCase().trim();
    return history[key] || { verses: [], songs: [] };
  }

  function recordUsage(theme, verse, song) {
    const history = loadHistory();
    const key = theme.toLowerCase().trim();
    if (!history[key]) history[key] = { verses: [], songs: [] };
    const entry = history[key];
    if (verse) {
      entry.verses = [verse, ...entry.verses.filter(v => v !== verse)].slice(0, HISTORY_LIMIT);
    }
    if (song) {
      entry.songs = [song, ...entry.songs.filter(s => s !== song)].slice(0, HISTORY_LIMIT);
    }
    saveHistory(history);
  }

  function extractVerseAndSong(text) {
    const verseMatch = text.match(/\(([1-3]?\s?[A-Z][a-z]+(?:\s[A-Z][a-z]+)?\s+\d+:\d+(?:[-–]\d+)?)\)/);
    const verse = verseMatch ? verseMatch[1].trim() : null;

    // Match "and our song is <Title>" pattern
    const songMatch = text.match(/and our song is\s+(.+)/i);
    const song = songMatch ? songMatch[1].trim() : null;

    return { verse, song };
  }

  async function generate() {
    const apiKey = localStorage.getItem('claude_api_key') || '';
    if (!apiKey) {
      alert('Please tap ⚙️ API Key Settings and enter your Claude API key first.');
      return;
    }

    const rawTheme = document.getElementById('theme').value.trim();
    const theme = rawTheme || THEMES[Math.floor(Math.random() * THEMES.length)];
    if (!rawTheme) document.getElementById('theme').value = theme;

    const btn = document.getElementById('generate-btn');
    const spinner = document.getElementById('spinner');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copy-btn');

    btn.disabled = true;
    spinner.classList.add('visible');
    output.className = 'placeholder';
    output.textContent = '';
    copyBtn.style.display = 'none';

    const themeHistory = getThemeHistory(theme);
    let avoidSection = '';
    if (themeHistory.verses.length > 0 || themeHistory.songs.length > 0) {
      avoidSection = '\n\nIMPORTANT — to keep things fresh, do NOT use any of these previously used items:';
      if (themeHistory.verses.length > 0) {
        avoidSection += `\nBible verses already used: ${themeHistory.verses.join(', ')}`;
      }
      if (themeHistory.songs.length > 0) {
        avoidSection += `\nHymns/songs already used: ${themeHistory.songs.join(', ')}`;
      }
      avoidSection += '\nChoose a different verse and a different song.';
    }

    const prompt = `You are helping an 88-year-old Christian grandmother create her daily morning text message to her family.

Theme for today: "${theme}"${avoidSection}

Draw the song from this broad list of classic hymns and worship songs (do NOT always default to the most famous ones — rotate widely across this list):
A Mighty Fortress Is Our God, Abide With Me, All Creatures of Our God and King, All Hail the Power of Jesus' Name, All the Way My Savior Leads Me, Amazing Grace, And Can It Be, Are You Washed in the Blood, At Calvary, At the Cross, Beneath the Cross of Jesus, Blessed Assurance, Blest Be the Tie That Binds, Built on the Rock, Christ the Lord Is Risen Today, Come Thou Almighty King, Come Thou Fount of Every Blessing, Come Ye Sinners Poor and Needy, Come Ye Thankful People Come, Crown Him with Many Crowns, Day by Day, Dear Lord and Father of Mankind, Does Jesus Care, Doxology, Eternal Father Strong to Save, Face to Face, Fairest Lord Jesus, Faith of Our Fathers, For the Beauty of the Earth, Give Me Jesus, Glorious Things of Thee Are Spoken, God of Grace and God of Glory, God of Our Fathers, Good Good Father, Grace Greater Than Our Sin, Great Is Thy Faithfulness, Guide Me O Thou Great Jehovah, Hallelujah What a Savior, He Hideth My Soul, He Is Lord, He Keeps Me Singing, His Eye Is on the Sparrow, Holy Holy Holy, How Deep the Father's Love for Us, How Firm a Foundation, How Great Is Our God, How Great Thou Art, I Am Thine O Lord, I Come to the Garden Alone, I Know That My Redeemer Lives, I Know Whom I Have Believed, I Love to Tell the Story, I Need Thee Every Hour, I Sing the Mighty Power of God, I Surrender All, I Will Sing of My Redeemer, Immortal Invisible God Only Wise, In Christ Alone, It Is Well with My Soul, I've Got Peace Like a River, Jesus Is All the World to Me, Jesus Keep Me Near the Cross, Jesus Loves Me, Jesus Paid It All, Jesus Shall Reign, Joyful Joyful We Adore Thee, Just a Closer Walk with Thee, Just As I Am, Lead On O King Eternal, Leaning on the Everlasting Arms, Let Us Break Bread Together, Lord I Want to Be a Christian, Love Divine All Loves Excelling, Love Lifted Me, My Faith Has Found a Resting Place, My Faith Looks Up to Thee, My Hope Is Built on Nothing Less, My Jesus I Love Thee, Near the Cross, Near to the Heart of God, No Not One, Nothing But the Blood, Now Thank We All Our God, O For a Thousand Tongues to Sing, O God Our Help in Ages Past, O How I Love Jesus, O Little Town of Bethlehem, O Lord My God, O Sacred Head Now Wounded, O Worship the King, On Jordan's Stormy Banks, Once to Every Man and Nation, Only Trust Him, Open My Eyes That I May See, Praise God from Whom All Blessings Flow, Praise Him Praise Him, Praise to the Lord the Almighty, Redeemed How I Love to Proclaim It, Rescue the Perishing, Revive Us Again, Rock of Ages, Savior Like a Shepherd Lead Us, Send the Light, Since Jesus Came Into My Heart, Softly and Tenderly, Spirit of God Descend Upon My Heart, Stand Up Stand Up for Jesus, Standing on the Promises, Sweet Hour of Prayer, Take My Life and Let It Be, Take the Name of Jesus with You, Tell Me the Old Old Story, Tell Me the Story of Jesus, The Battle Hymn of the Republic, The Church's One Foundation, The Solid Rock, The Unclouded Day, There Is a Fountain, There Is Power in the Blood, There Shall Be Showers of Blessing, This Is My Father's World, To God Be the Glory, Trust and Obey, Turn Your Eyes Upon Jesus, Under His Wings, Victory in Jesus, We Gather Together, Were You There, What a Fellowship, What a Friend We Have in Jesus, When I Survey the Wondrous Cross, When Morning Gilds the Skies, When Peace Like a River, When the Roll Is Called Up Yonder, When We All Get to Heaven, Whiter Than Snow, Wonderful Grace of Jesus, Wonderful Words of Life, Work for the Night Is Coming

Write a warm, heartfelt morning message that includes:
1. A short greeting line (just a few words, like "Good morning, family! 🌅")
2. One Bible verse that fits the theme — quote it in full, then the reference in parentheses
3. A short devotional paragraph (2–3 warm, encouraging sentences) reflecting on the verse and how it applies to daily life
4. A blank line
5. The exact phrase "and our song is" on its own line, immediately followed by the hymn/worship song title (example: "and our song is Amazing Grace"), then one short memorable verse or chorus (just 2–4 lines of lyrics) on the next line
6. A blank line
7. This exact closing (copy it word for word, do not change it):
Have a blessed and wonderful Jesus filled day today everyone!! lul Mom/Omi

Keep the whole message to about 16–20 lines total. Use simple, warm language. No bullet points, no headers — just flowing text with blank lines between sections. Do not add any commentary, introduction, or explanation outside the message itself.`;

    try {
      const callApi = async () => {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1024,
            messages: [{ role: 'user', content: prompt }]
          })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error?.message || `Error ${res.status}`);
        }
        const data = await res.json();
        return data.content?.[0]?.text || '';
      };

      let text = await callApi();
      if (text.trim().length < 200) text = await callApi();
      if (text.trim().length < 200) text = await callApi();

      output.className = '';
      output.textContent = text.trim();
      copyBtn.style.display = 'block';
      copyBtn.textContent = '📋 Copy Message';
      copyBtn.classList.remove('copied');

      const { verse, song } = extractVerseAndSong(text);
      recordUsage(theme, verse, song);

    } catch (e) {
      output.className = '';
      output.textContent = '❌ Something went wrong:\n' + e.message;
    }

    btn.disabled = false;
    spinner.classList.remove('visible');
  }

  async function copyMessage() {
    const text = document.getElementById('output').textContent;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // iOS fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 Copy Message';
      btn.classList.remove('copied');
    }, 2500);
  }
</script>

</body>
</html>
